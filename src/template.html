<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>k1ngmang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { padding: 0; margin: 0; }

    .btn {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      will-change: transform;
    }

    .btn:hover {
      background: #ffffff;
      color: #111111;
      box-shadow: inset 0 0 0 1px #111111;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0) scale(0.97);
    }

    .btn:focus-visible {
      outline: 2px solid #3446eb;
      outline-offset: 2px;
    }
  </style>
</head>

<body>

<div id="elm"></div>

<!-- ELM_SCRIPT -->

<script>
try
{
  Elm.Main.init({ node: document.getElementById("elm") });
}
catch (e)
{
  // display initialization errors (e.g. bad flags, infinite recursion)
  var header = document.createElement("h1");
  header.style.fontFamily = "monospace";
  header.innerText = "Initialization Error";
  var pre = document.getElementById("elm");
  document.body.insertBefore(header, pre);
  pre.innerText = e;
  throw e;
}
</script>

</body>
</html>
